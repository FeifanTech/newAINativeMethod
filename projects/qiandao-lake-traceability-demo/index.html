<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>千岛湖全鱼品溯源平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <a href="#/" class="brand">
          <span class="brand-icon"></span>
          <span class="brand-text">千岛湖全鱼品溯源平台</span>
        </a>
        <nav class="nav" id="nav-main"></nav>
      </div>
    </header>
    <main id="main" class="main"></main>
    <footer class="footer">
      <div class="footer-inner">
        <p>Demo 数据仅存于浏览器 localStorage，无后端 · 依据 PRD/技术方案 v0.4（含上下游数量约束）</p>
      </div>
    </footer>
  </div>
  <!-- 地图选点弹层（水域） -->
  <div id="map-picker-modal" class="map-picker-modal" role="dialog" aria-label="地图选点" style="display:none;">
    <div class="map-picker-backdrop"></div>
    <div class="map-picker-box">
      <h3 class="map-picker-title">选择水域位置（点击地图选点）</h3>
      <div id="map-picker-container" class="map-picker-container"></div>
      <p class="map-picker-hint" id="map-picker-hint">点击地图标记养殖/捕捞水域位置</p>
      <div class="map-picker-actions">
        <button type="button" class="btn btn-default" id="map-picker-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="map-picker-confirm">确认选点</button>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <script src="js/options.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
